[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-org-os"
version = "0.1.0"
description = "Portable multi-agent AI organization platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ashish Agarwal" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
grok-org = "grok_org_os.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["grok_org_os*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
